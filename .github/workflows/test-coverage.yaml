# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

name: test-coverage

concurrency:
  # Group by ref so a PR run and a branch-push run never cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@main
    secrets: inherit
