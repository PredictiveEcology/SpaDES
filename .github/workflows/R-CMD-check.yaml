# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
    secrets: inherit
    with:
      # Deep legs pinned to exact R versions, not oldrel-N. The oldrel ladder
      # is platform-dependent and not monotone: on ubuntu-latest oldrel-4 and
      # oldrel-5 both resolve to 4.1.3 and R 4.2 is unreachable entirely, and
      # on ubuntu-22.04 oldrel-4 gives R 3.6.3. DESCRIPTION declares
      # R (>= 4.3) -- raised from 4.2 in this PR, because every Import
      # (quickPlot, reproducible, SpaDES.core, SpaDES.tools) already declares
      # R (>= 4.3), so 4.2 was never installable. 4.3 is now both the declared
      # floor and a leg the matrix actually runs.
      extra-config: |
        [{"config": {"os": "ubuntu-latest", "nosuggests": false, "r": "4.4"}},
         {"config": {"os": "ubuntu-latest", "nosuggests": false, "r": "4.3"}}]
